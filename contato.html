<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine de Profissões Digitais</title>
    <link rel="stylesheet" href="/CSS/contato.css">
</head>

<body>
    <header>
        <div class="container">
            <div class="logo">
                <img src="IMG/logo.png">
            </div>

            <nav>
                <div class="link">
                    <a href="http://127.0.0.1:5500/index.html">ínicio</a>
                    <a href="http://127.0.0.1:5500/contato.html">Formulario</a>

                </div>
            </nav>
            <div class="botao">

            </div>
    </header>

    <section>
        <p>ㅤ</p>

        <p>ㅤ</p>
        <h1>Vitrine de Profissões Digitais</h1>
        <p>ㅤ</p>
         
         <form class="formulario">
        <h2>Cadastro</h2>

        <label for="nome">Nome completo:</label>
        <input type="text" id="nome" placeholder="Digite seu nome" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" placeholder="Digite seu e-mail" required>

        <label for="idade">Idade:</label>
        <input type="number" id="idade" min="1" placeholder="Sua idade" required>

        <label for="profissao">Profissão:</label>
        <select id="profissao" required>
            <option value="">Escolha uma profissão</option>
            <option>Médico</option>
            <option>Professor</option>
            <option>Bombeiro</option>
            <option>Policial</option>
            <option>Veterinário</option>
            <option>Padeiro</option>
            <option>Mecânico</option>
            <option>Advogado</option>
            <option>Jornalista</option>
            <option>Dentista</option>
            <option>Outros</option>
        </select>

        <label for="mensagem">Sobre você:</label>
        <textarea id="mensagem" rows="3"
            placeholder="Conte um pouco sobre você"></textarea>

        <button type="submit">Enviar formulário</button>
    </form>

        
        <footer class="footer">
            <p> Feito por Raphael.</p>
        </footer>
</body>

</html>
